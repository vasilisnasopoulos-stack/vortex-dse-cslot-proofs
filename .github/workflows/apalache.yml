name: Apalache Type Check

on:
  push:
    paths:
      - 'specs/**.tla'
  workflow_dispatch:

jobs:
  apalache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Apalache type check
        run: |
          docker run --rm \
            -v "$PWD/specs:/var/apalache" \
            ghcr.io/informalsystems/apalache:latest \
            typecheck Vortex_DSE_CSlot.tla
