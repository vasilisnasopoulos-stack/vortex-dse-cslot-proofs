name: Apalache Type Check

on:
  push:
    branches:
      - main
    paths:
      - 'specs/**/*.tla'
      - '.github/workflows/apalache.yml'
      - 'README.md'
  workflow_dispatch:

jobs:
  apalache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Apalache type check
        run: |
          docker run --rm \
            -v "$PWD/specs:/var/apalache" \
            ghcr.io/informalsystems/apalache:latest \
            typecheck --out-dir=/tmp/apalache-out Vortex_DSE_CSlot.tla
