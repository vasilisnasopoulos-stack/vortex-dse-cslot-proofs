name: TLAPS Proof Verification

on:
  push:
    branches:
      - main
    paths:
      - 'specs/**/*.tla'
      - '.github/workflows/tlaps.yml'
      - 'README.md'
  workflow_dispatch:

# NOTE: tlapm exits 0 even when proof obligations FAIL (it only prints
# "[ERROR]: N/M obligations failed"). A bare `tlapm` step therefore reports
# green with unproved obligations. Each step below captures output and fails
# explicitly if any obligation failed.
jobs:
  tlaps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TLAPS
        run: |
          wget -q https://github.com/tlaplus/tlapm/releases/download/202210041448/tlaps-1.5.0-x86_64-linux-gnu-inst.bin
          chmod +x tlaps-1.5.0-x86_64-linux-gnu-inst.bin
          ./tlaps-1.5.0-x86_64-linux-gnu-inst.bin -d $HOME/tlaps
          echo "$HOME/tlaps/bin" >> $GITHUB_PATH

      - name: Verify ExactlyOnce Proof
        run: |
          cd specs
          tlapm --toolbox 0 0 Vortex_DSE_CSlot_ExactlyOnce_Proof.tla 2>&1 | tee out.log
          if grep -q "obligations failed" out.log; then echo "::error::unproved obligations"; exit 1; fi

      - name: Verify TypeInvariant + NoFutureAdmission Proofs
        run: |
          cd specs
          tlapm --toolbox 0 0 Vortex_DSE_CSlot_Proofs.tla 2>&1 | tee out.log
          if grep -q "obligations failed" out.log; then echo "::error::unproved obligations"; exit 1; fi
